[versions]
springBoot = "4.1.1"
springdoc = "3.1.1"
swaggerAnnotations = "2.2.28"
dependencyManagement = "1.1.7"
zxing = "3.5.3"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-web = { module = "org.springframework:spring-web" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
spring-context = { module = "org.springframework:spring-context" }
jakarta-servlet = { module = "jakarta.servlet:jakarta.servlet-api" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jakarta-persistence = { module = "jakarta.persistence:jakarta.persistence-api" }
springdoc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
swagger-annotations = { module = "io.swagger.core.v3:swagger-annotations-jakarta", version.ref = "swaggerAnnotations" }
postgresql = { module = "org.postgresql:postgresql" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
