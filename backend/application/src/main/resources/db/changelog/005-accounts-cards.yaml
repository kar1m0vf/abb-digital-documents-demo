databaseChangeLog:
  - changeSet:
      id: 005-accounts-cards
      author: embassy-flow
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: account_number
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: NUMERIC(18,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: account_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: cards
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: masked_number
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: card_brand
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: expiry
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: accounts
            baseColumnNames: customer_id
            constraintName: fk_accounts_customer
            referencedTableName: customers
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: cards
            baseColumnNames: account_id
            constraintName: fk_cards_account
            referencedTableName: accounts
            referencedColumnNames: id
        - createIndex:
            tableName: accounts
            indexName: idx_accounts_customer_id
            columns:
              - column:
                  name: customer_id
        - createIndex:
            tableName: cards
            indexName: idx_cards_account_id
            columns:
              - column:
                  name: account_id
