databaseChangeLog:
  # --- Portal üçün əlavə kolon ---
  - changeSet:
      id: 009a-document-rejection-note
      author: embassy-flow
      changes:
        - addColumn:
            tableName: document_orders
            columns:
              - column:
                  name: rejection_note
                  type: VARCHAR(500)

  # --- Portal istifadəçiləri (T10.1, API.md #15) ---
  - changeSet:
      id: 009b-portal-users
      author: embassy-flow
      changes:
        - createTable:
            tableName: portal_users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: embassy_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: portal_users
            baseColumnNames: embassy_id
            constraintName: fk_portal_users_embassy
            referencedTableName: embassies
            referencedColumnNames: id
        - insert:
            tableName: portal_users
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: embassy_id, valueNumeric: 1 }
              - column: { name: username, value: "admin@italy" }
              - column: { name: password, value: "demo1234" }
              - column: { name: full_name, value: "Aydan Əhadova" }
              - column: { name: role, value: "ADMIN" }
              - column: { name: active, valueBoolean: true }
        - sql:
            dbms: postgresql
            sql: ALTER SEQUENCE portal_users_id_seq RESTART WITH 2

